name: Bug report
description: Report a reproducible issue on Gil Odin Control 3
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: 0.7.0-studio
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Odin 3 firmware version
      placeholder: 1.0.0.151
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redact personal information)
      description: Remove account names, device identifiers, tokens, and other private data.
    validations:
      required: false
